name: Deploy MARMOO BI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  MARMOO_DATA_URL: https://script.google.com/macros/s/AKfycbzglLMWDMZRc1NAzWi_Lluo1O69XAVURkNf8mWn_c6XRzlkvzXQkL8nCoumMG6Z_dAB/exec
  MARMOO_SALES_DATA_URL: https://script.google.com/macros/s/AKfycbz-ptK7zk4cVFNwCkjUhghPYlVCORiqyafmGtI9dvxqCOJIGV4K12dlhZq4OlaIO0yyzQ/exec
  MARMOO_REVIEWS_API_URL: https://script.google.com/macros/s/AKfycbx7oCTUXwRGY1EqnVBsDfSDDI5Zr1-D1K-Cy9NK1altm5a9MOezTpr828m7KkgoC3Hj/exec
  MARMOO_BI_SPREADSHEET_ID: 1EhKZ6oP95aXe3GL4iIDfGd5NmYbQPKIHat4Sml76TKo

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fetch General and Dishes snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public tmp
          CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          TEMP_FILE="tmp/feedback-data.json"
          if curl --fail --location --silent --show-error --retry 2 --retry-delay 5 "${MARMOO_DATA_URL}?_=${CACHE_BUST}" --output "$TEMP_FILE"; then
            if node - "$TEMP_FILE" <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8').trim();
          if (raw.startsWith('<!DOCTYPE') || raw.startsWith('<html')) process.exit(1);
          const payload = JSON.parse(raw);
          if (!Array.isArray(payload.general) || !Array.isArray(payload.dishes)) process.exit(1);
          NODE
            then mv "$TEMP_FILE" public/data.json; else printf '{"general":[],"dishes":[]}' > public/data.json; fi
          else
            printf '{"general":[],"dishes":[]}' > public/data.json
          fi

      - name: Fetch Sales BI snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public tmp
          CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          TEMP_FILE="tmp/sales-data.json"
          FALLBACK='{"ok":true,"schemaVersion":2,"summary":{"orders":0,"revenue":0,"margin":0,"avgCheck":0},"daily":[],"channels":[],"channelsDaily":[],"hourly":[],"hourlyDaily":[],"products":[],"productsDaily":[],"heatmap":[],"operatingHours":{"open":10,"close":22},"dataQuality":{"fallback":true}}'
          if curl --fail --location --silent --show-error --retry 2 --retry-delay 5 "${MARMOO_SALES_DATA_URL}?_=${CACHE_BUST}" --output "$TEMP_FILE"; then
            if node - "$TEMP_FILE" <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8').trim();
          if (raw.startsWith('<!DOCTYPE') || raw.startsWith('<html')) process.exit(1);
          const p = JSON.parse(raw);
          if (Number(p.schemaVersion) !== 2) process.exit(1);
          NODE
            then mv "$TEMP_FILE" public/sales-data.json; else printf '%s' "$FALLBACK" > public/sales-data.json; fi
          else
            printf '%s' "$FALLBACK" > public/sales-data.json
          fi

      - name: Check Reviews API
        shell: bash
        run: |
          set -euo pipefail
          TEMP_FILE="tmp/reviews-health.json"
          if curl --fail --location --silent --show-error --max-time 30 "${MARMOO_REVIEWS_API_URL}?action=health&_=${GITHUB_RUN_ID}" --output "$TEMP_FILE"; then
            node - "$TEMP_FILE" <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8').trim();
          if (raw.startsWith('<')) throw new Error('Reviews API returned HTML');
          const p = JSON.parse(raw);
          if (!p.ok) throw new Error(p.error || 'Reviews API health check failed');
          console.log('Reviews API OK');
          NODE
          else
            echo "Reviews API health check unavailable; build will continue with client-side error state."
          fi

      - name: Build Intelligence snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp public
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 "https://docs.google.com/spreadsheets/d/${MARMOO_BI_SPREADSHEET_ID}/export?format=csv&gid=1054385308" --output tmp/BI_ORDERS.csv
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 "https://docs.google.com/spreadsheets/d/${MARMOO_BI_SPREADSHEET_ID}/export?format=csv&gid=1526808551" --output tmp/BI_ORDER_ITEMS.csv
          npm run build:intelligence-data -- tmp/BI_ORDERS.csv tmp/BI_ORDER_ITEMS.csv public/intelligence-data.json

      - name: TypeScript check
        run: npm run lint

      - name: Clean build project
        run: |
          rm -rf dist
          npm run build
        env:
          VITE_API_URL: /marmoo-fb/data.json
          VITE_REVIEWS_API_URL: ${{ env.MARMOO_REVIEWS_API_URL }}

      - name: Verify reviews route in bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "dashboard_reviews" dist/assets
          grep -R -q "Керування відгуками" dist/assets
          grep -R -q "Спільна база синхронізована" dist/assets
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.txt
          touch dist/.nojekyll

      - name: Publish gh-pages branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git branch -M gh-pages
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
