name: Deploy MARMOO BI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Nightly refresh at 02:15 UTC (04:15/05:15 Kyiv depending on DST).
    - cron: "15 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MARMOO_DATA_URL: https://script.google.com/macros/s/AKfycbzglLMWDMZRc1NAzWi_Lluo1O69XAVURkNf8mWn_c6XRzlkvzXQkL8nCoumMG6Z_dAB/exec
  MARMOO_SALES_DATA_URL: https://script.google.com/macros/s/AKfycbzgWeDuDcGvTO7vCD8eMA4cfIuHTt9K2JEKD86Uo51Lj1oCcKw1K9JK5MwTha63g3hnKA/exec

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fetch General and Dishes snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 \
            "${MARMOO_DATA_URL}?_=${CACHE_BUST}" \
            --output public/data.json

          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('public/data.json', 'utf8').trim();

          if (raw.startsWith('<!DOCTYPE') || raw.startsWith('<html')) {
            throw new Error('Feedback Apps Script returned HTML instead of JSON. Check the deployed /exec URL and doGet().');
          }

          const payload = JSON.parse(raw);
          if (!Array.isArray(payload.general) || !Array.isArray(payload.dishes)) {
            throw new Error('Invalid feedback BI payload: expected general[] and dishes[].');
          }

          console.log(`Loaded ${payload.general.length} General rows and ${payload.dishes.length} Dishes rows`);
          NODE

      - name: Fetch Sales BI schema v2 snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          SALES_URL="${MARMOO_SALES_DATA_URL}?_=${CACHE_BUST}"

          echo "Fetching fresh Sales snapshot..."

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 \
            --header "Cache-Control: no-cache, no-store, max-age=0" \
            --header "Pragma: no-cache" \
            "$SALES_URL" \
            --output public/sales-data.json

          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('public/sales-data.json', 'utf8').trim();

          if (raw.startsWith('<!DOCTYPE') || raw.startsWith('<html')) {
            throw new Error('Sales Apps Script returned HTML instead of JSON. Check the deployed /exec URL and doGet().');
          }

          const payload = JSON.parse(raw);

          if (payload.ok === false) {
            throw new Error(`Sales API error: ${payload.error || 'unknown error'}`);
          }

          if (Number(payload.schemaVersion) !== 2) {
            throw new Error(`Invalid Sales schema: expected schemaVersion 2, received ${payload.schemaVersion ?? 'missing'}`);
          }

          const requiredArrays = [
            'daily',
            'channels',
            'channelsDaily',
            'hourly',
            'hourlyDaily',
            'products',
            'productsDaily',
            'heatmap',
          ];

          if (!payload.summary) {
            throw new Error('Invalid Sales BI payload: summary is missing.');
          }

          for (const key of requiredArrays) {
            if (!Array.isArray(payload[key])) {
              throw new Error(`Invalid Sales BI payload: expected ${key}[].`);
            }
          }

          console.log(
            `Loaded Sales schema v${payload.schemaVersion}: ` +
            `${payload.summary.orders || 0} orders, ` +
            `${payload.daily.length} days, ` +
            `${payload.products.length} products, ` +
            `${payload.heatmap.length} heatmap cells`
          );
          NODE

      - name: Build Project
        run: npm run build
        env:
          VITE_API_URL: /marmoo-fb/data.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
